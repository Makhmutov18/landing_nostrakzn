server {
    listen 192.168.0.153:80;
    server_name nostrakzn.ru www.nostrakzn.ru 195.19.144.143;

    root /var/www/nostra/current;
    index index.html;

    client_max_body_size 12m;

    # Temporary bridge while the Telegram secret is being rotated and moved to
    # the VPS. The public page is served here; only lead delivery uses the
    # existing protected Sites endpoint.
    location = /api/request {
        limit_except POST { deny all; }
        proxy_pass https://coffee-nostra-kazan.makhmutov18m.chatgpt.site/api/request;
        proxy_ssl_server_name on;
        proxy_set_header Host coffee-nostra-kazan.makhmutov18m.chatgpt.site;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 30s;
    }

    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        return 404;
    }
}
