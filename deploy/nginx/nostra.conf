server {
    listen 192.168.0.153:80;
    server_name nostrakzn.ru www.nostrakzn.ru;

    return 301 https://nostrakzn.ru$request_uri;
}

server {
    listen 192.168.0.153:443 ssl;
    server_name www.nostrakzn.ru;

    ssl_certificate /etc/letsencrypt/live/nostrakzn.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nostrakzn.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://nostrakzn.ru$request_uri;
}

server {
    listen 192.168.0.153:443 ssl;
    server_name nostrakzn.ru;

    ssl_certificate /etc/letsencrypt/live/nostrakzn.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nostrakzn.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/nostra/current;
    index index.html;

    client_max_body_size 12m;

    location = /api/request {
        limit_except POST { deny all; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/nostra/current/api/request.php;
        fastcgi_param SCRIPT_NAME /api/request.php;
        fastcgi_pass unix:/var/www/php-fpm/1.sock;
        fastcgi_read_timeout 30s;
    }

    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        return 404;
    }
}
